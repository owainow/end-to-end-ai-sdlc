name: Build and Deploy to Cloud Run

on:
  push:
    branches: [main]  # Triggers when PR is merged to main
  pull_request:
    types: [review_requested]
    branches: [main]  # Preview deploy when a review is requested
  workflow_dispatch:   # Manual trigger
    inputs:
      canary_percent:
        description: "Send this % of traffic to the latest revision (blank = 100)"
        required: false
        default: ""

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: europe-west2
  AR_REPO: weatherapp
  SERVICE: weatherapp
  IMAGE_BASE: europe-west2-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/weatherapp/weatherapp

permissions:
  contents: read
  id-token: write  # OIDC token for Workload Identity Federation

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Cloud auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ============================================
      # BUILD AND PUSH
      # ============================================

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ env.IMAGE_BASE }}:${{ github.sha }}
          IMAGE_LATEST=${{ env.IMAGE_BASE }}:latest

          docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # ============================================
      # DEPLOY
      # ============================================

      # PRs get a tagged, zero-traffic preview revision:
      # https://pr-<n>---<service>-<hash>.run.app
      - name: Deploy PR preview (no traffic)
        if: github.event_name == 'pull_request'
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --image ${{ env.IMAGE_TAG }} \
            --port 8000 \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 3 \
            --set-secrets OPENWEATHERMAP_API_KEY=openweathermap-api-key:latest \
            --no-traffic \
            --tag pr-${{ github.event.pull_request.number }}

      - name: Deploy to Cloud Run (live)
        if: github.event_name != 'pull_request'
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --image ${{ env.IMAGE_TAG }} \
            --port 8000 \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 3 \
            --set-secrets OPENWEATHERMAP_API_KEY=openweathermap-api-key:latest

      # A/B: workflow_dispatch with canary_percent=10 sends 10% of traffic
      # to the newest revision and keeps the rest on the previous one.
      - name: Apply canary traffic split
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.canary_percent != ''
        run: |
          gcloud run services update-traffic ${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --to-revisions=LATEST=${{ github.event.inputs.canary_percent }}

      - name: Get App URL and Revision URL
        run: |
          APP_URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --format "value(status.url)")

          REVISION_NAME=$(gcloud run services describe ${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --format "value(status.latestCreatedRevisionName)")

          echo "🚀 **Deployment Complete**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| URL Type | Link |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Live URL | $APP_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ Revision | \`$REVISION_NAME\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PREVIEW_URL=$(gcloud run services describe ${{ env.SERVICE }} \
              --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
              --format json | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((t['url'] for t in d['status'].get('traffic',[]) if t.get('tag')=='pr-${{ github.event.pull_request.number }}'), ''))")
            echo "| 📌 PR preview (0% traffic) | $PREVIEW_URL |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "🚀 Live URL: $APP_URL"
          echo "🏷️ Revision: $REVISION_NAME"
